# Integración continua: en cada push o pull request a main (y cada lunes),
# GitHub levanta una base PostgreSQL temporal con Docker Compose, compila el proyecto
# con Maven y ejecuta todas las pruebas, incluidas las de la base de datos.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions
  schedule:
    - cron: '0 12 * * 1'   # todos los lunes a las 09:00 de Chile (12:00 UTC)

# Mínimo privilegio: el workflow solo puede leer el repositorio
permissions:
  contents: read

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # no deja la credencial de GitHub guardada en el equipo

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Crear contraseñas temporales para la base de datos de prueba
        run: |
          CLAVE_POSTGRES=$(openssl rand -hex 16)
          CLAVE_APP=$(openssl rand -hex 16)
          echo "::add-mask::$CLAVE_POSTGRES"
          echo "::add-mask::$CLAVE_APP"
          {
            echo "POSTGRES_PASSWORD=$CLAVE_POSTGRES"
            echo "ALTAMAR_DB_URL=jdbc:postgresql://127.0.0.1:5433/altamar"
            echo "ALTAMAR_DB_USER=altamar_app"
            echo "ALTAMAR_DB_PASSWORD=$CLAVE_APP"
          } > .env

      - name: Levantar PostgreSQL con Docker Compose
        run: docker compose up -d --wait

      - name: Compilar, probar y empaquetar
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: target/surefire-reports/

      - name: Apagar PostgreSQL y borrar los datos de prueba
        if: always()
        run: docker compose down -v