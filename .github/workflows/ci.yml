# Integración continua: en cada push o pull request a main (y cada lunes),
# GitHub compila el proyecto con Maven y ejecuta todas las pruebas.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions
  schedule:
    - cron: '0 12 * * 1'   # todos los lunes a las 09:00 de Chile (12:00 UTC)

# Mínimo privilegio: el workflow solo puede leer el repositorio
permissions:
  contents: read

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # no deja la credencial de GitHub guardada en el equipo

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar, probar y empaquetar
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: target/surefire-reports/